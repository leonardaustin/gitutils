version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/gitcloneall"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      gomod-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/gitpullall"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      gomod-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/goget"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      gomod-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
